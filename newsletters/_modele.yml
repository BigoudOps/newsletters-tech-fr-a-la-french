# Modèle de fiche : copiez ce fichier en `newsletters/<slug>.yml`
# (slug = nom en minuscules, sans accents, mots séparés par des tirets).
# Les fichiers commençant par `_` sont ignorés.

# Obligatoire
nom: Ma Newsletter
url: https://exemple.fr/newsletter
description: Une phrase qui dit de quoi parle la newsletter (200 caractères max).
thematiques: [dev]          # 1 à 3 valeurs parmi thematiques.yml, la première sert au classement
frequence: hebdomadaire     # quotidienne | hebdomadaire | bimensuelle | mensuelle | irreguliere

# Facultatif
auteur: Prénom Nom
gratuite: true              # false si l'accès est payant
